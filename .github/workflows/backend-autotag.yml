name: Backend Auto Tag

# After CI passes on main, compute the next semver tag from Conventional
# Commits and push it (plus a GitHub Release). Prod deploys pick one of
# these tags via backend-prod-deploy-render.yml.

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

concurrency:
  group: autotag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Latest existing vX.Y.Z tag, or v0.0.0 if none exist yet.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          echo "Latest tag: $latest"

          ver="${latest#v}"
          major="${ver%%.*}"
          rest="${ver#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"

          # Commits since the last tag (all commits if there is no tag yet).
          if git rev-parse "$latest" >/dev/null 2>&1; then
            range="${latest}..HEAD"
          else
            range="HEAD"
          fi
          commits="$(git log --format='%s%n%b' "$range" || true)"

          bump="patch"
          if echo "$commits" | grep -qE '(^|[[:space:]])BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
            bump="major"
          elif echo "$commits" | grep -qE '^feat(\(.+\))?:'; then
            bump="minor"
          fi
          echo "Bump: $bump"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

          gh release create "$NEXT_TAG" \
            --target "$SHA" \
            --title "$NEXT_TAG" \
            --generate-notes
